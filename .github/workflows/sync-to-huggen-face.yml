name: Sync to Hugging Face Space

on:
  push:
    branches:
      - code

jobs:
  sync-to-hub:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Configure git identity
        run: |
          git config --global user.email "ci@github-actions.local"
          git config --global user.name "GitHub Actions"

      - name: Create clean orphan deploy branch
        run: |
          # Orphan branch = no history, so HF never sees old binary commits
          git checkout --orphan deploy

          # Remove binary/build files HF rejects
          rm -f public/*.png public/*.jpg public/*.ico || true
          rm -rf build node_modules || true

          git add .
          git commit -m "deploy: clean snapshot"

      - name: Push to Hugging Face
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          git remote add hf https://yousseftallal:$HF_TOKEN@huggingface.co/spaces/yousseftallal/frontend
          git push hf deploy:main --force